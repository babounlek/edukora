services:

  db:
    image: postgres:17-alpine
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:

    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    env_file:
      - .env

    depends_on:
      - db

    volumes:
      - static_files:/app/staticfiles
      - ./media:/app/media
      - ./backend/ingest:/app/ingest
      # PDF sujet/corrigé d'Épreuve Inédite (voir inedit.storage.protected_storage) -
      # sans ce montage, ce dossier vit dans le filesystem éphémère du conteneur et
      # est perdu à chaque rebuild (constaté : 500 FileNotFoundError après un rebuild,
      # alors même que la ligne en base pointait toujours vers le fichier). Sans effet
      # en production, qui utilise S3 (voir STORAGES["inedit_protected"] en prod).
      - ./protected_media:/app/protected_media

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    # RCLONE_CONFIG_SPACES_* configure le remote "spaces" de rclone via variables
    # d'environnement (convention imposee par rclone) - a partir des memes valeurs
    # SPACES_* que backup.sh/restore.sh lisent directement pour le reste.
    environment:
      TZ: ${TZ:-UTC}
      RCLONE_CONFIG_SPACES_TYPE: s3
      RCLONE_CONFIG_SPACES_PROVIDER: DigitalOcean
      RCLONE_CONFIG_SPACES_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID}
      RCLONE_CONFIG_SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_SPACES_ENDPOINT: ${SPACES_ENDPOINT}
      RCLONE_CONFIG_SPACES_REGION: ${SPACES_REGION}

    depends_on:
      - db

    volumes:
      - ./media:/media:ro

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile

    depends_on:
      - backend


  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
      # `env_file` ci-dessous ne vaut qu'à l'exécution : les variables Vite sont
      # figées dans le bundle au build, elles doivent donc passer par `args`.
      # Reprise depuis l'environnement du shell qui lance la commande - la syntaxe
      # `${VAR}` va chercher .env à la racine du projet, que Compose charge de
      # lui-même pour l'interpolation.
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}

    env_file:
      - .env

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      - backend
      - frontend

    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - static_files:/srv/staticfiles:ro
      - ./media:/srv/media:ro

volumes:

  postgres_data:
  static_files:
  caddy_data:
  caddy_config: