<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <!-- viewport-fit=cover : sans lui, env(safe-area-inset-bottom) vaut 0 sur iPhone et la barre
         d'onglets du bas passe sous le geste « accueil ». -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Applique le thème sombre choisi avant le premier rendu : sans cela, la classe n'était
         posée qu'après le chargement de React, d'où un flash blanc. Même clé et même logique que
         theme-provider.tsx ; le thème par défaut de l'app est « clair ». -->
    <script>
      try {
        var t = localStorage.getItem("edukamer-theme") || "light";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(t === "dark" ? "dark" : "light");
      } catch (e) {}
    </script>
    <title>%VITE_SITE_NAME% - Corrigés BEPC, Probatoire et BAC au Cameroun</title>
    <meta
      name="description"
      content="Chaque jour, on te dit quoi réviser pour le BEPC, le Probatoire et le BAC au Cameroun : les thèmes qui tombent vraiment, avec corrigés d'annales et quiz. Sujets en accès libre."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="theme-color" content="#0a6e4e" />

    <meta property="og:site_name" content="%VITE_SITE_NAME%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/partage-image/defaut.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:title" content="%VITE_SITE_NAME% - Corrigés BEPC, Probatoire et BAC au Cameroun" />
    <meta
      property="og:description"
      content="Chaque jour, on te dit quoi réviser pour ton examen : les thèmes qui tombent vraiment au BEPC, au Probatoire et au BAC."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/partage-image/defaut.png" />
    <meta name="twitter:title" content="%VITE_SITE_NAME% - Corrigés BEPC, Probatoire et BAC au Cameroun" />
    <meta
      name="twitter:description"
      content="Chaque jour, on te dit quoi réviser pour ton examen : les thèmes qui tombent vraiment au BEPC, au Probatoire et au BAC."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif; text-align: center">
        %VITE_SITE_NAME% a besoin de JavaScript pour fonctionner. Active-le dans ton navigateur, ou ouvre
        ce lien dans Chrome ou Safari, puis recharge la page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
