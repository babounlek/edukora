<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="5_x_ZP2_cnQFvcEv1j5lZFvRqsFr8bp8VLvxYeEBPAw" />
    <!-- Identité visuelle : fichiers générés par scripts/brand/build-brand.mjs (symbole seul, lisible dès 16 px).
         Le .ico sert les navigateurs sans SVG et les robots qui le demandent à la racine ; le SVG passe en dernier,
         les navigateurs qui le gèrent le préfèrent. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover : sans lui, env(safe-area-inset-bottom) vaut 0 sur iPhone et la barre
         d'onglets du bas passe sous le geste « accueil ». -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Applique le thème sombre choisi avant le premier rendu : sans cela, la classe n'était
         posée qu'après le chargement de React, d'où un flash blanc. Même clé et même logique que
         theme-provider.tsx ; le thème par défaut de l'app est « clair ». -->
    <script>
      try {
        var t = localStorage.getItem("edukamer-theme") || "light";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(t === "dark" ? "dark" : "light");
      } catch (e) {}
    </script>
    <title>%VITE_SITE_NAME% - Corrigés BEPC, Probatoire et BAC au Cameroun</title>
    <meta
      name="description"
      content="Chaque jour, on te dit quoi réviser pour le BEPC, le Probatoire et le BAC au Cameroun : les thèmes qui tombent vraiment, avec corrigés d'annales et quiz. Sujets en accès libre."
    />
    <!-- Liens profonds /en/... : le titre et la description ci-dessus sont ceux de la version française, seul état connu
         avant l'exécution du JavaScript (l'app les remplace ensuite page par page, voir lib/seo.ts). Un élève du GCE voyait
         donc « Corrigés BEPC, Probatoire et BAC » dans son onglet pendant le chargement, et sur toute page sans titre propre. -->
    <script>
      (function () {
        var p = location.pathname;
        if (p !== "/en" && p.indexOf("/en/") !== 0) return;
        document.documentElement.lang = "en";
        document.title = "%VITE_SITE_NAME% - Past papers and solutions for the GCE in Cameroon";
        var d = document.querySelector('meta[name="description"]');
        if (d) d.setAttribute("content", "Every day, we tell you what to revise for the GCE in Cameroon: the topics that really come up, with solved past papers and quizzes.");
      })();
    </script>
    <!-- Pas de <link rel="canonical"> ici : ce HTML est celui de TOUTES les pages (SPA), un canonical figé sur « / » les
         déclarait toutes équivalentes à l'accueil avant l'exécution du JavaScript (« Google n'a pas choisi la même URL
         canonique que l'utilisateur » dans la Search Console). BalisesDeRoute le pose, page par page. -->
    <meta name="theme-color" content="#0a6e4e" />

    <meta property="og:site_name" content="%VITE_SITE_NAME%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/partage-image/defaut.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:title" content="%VITE_SITE_NAME% - Corrigés BEPC, Probatoire et BAC au Cameroun" />
    <meta
      property="og:description"
      content="Chaque jour, on te dit quoi réviser pour ton examen : les thèmes qui tombent vraiment au BEPC, au Probatoire et au BAC."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/partage-image/defaut.png" />
    <meta name="twitter:title" content="%VITE_SITE_NAME% - Corrigés BEPC, Probatoire et BAC au Cameroun" />
    <meta
      name="twitter:description"
      content="Chaque jour, on te dit quoi réviser pour ton examen : les thèmes qui tombent vraiment au BEPC, au Probatoire et au BAC."
    />

    <!-- Données structurées du site (Organization et WebSite) : dans le HTML initial, donc lues par tout robot, avec ou
         sans JavaScript. Les %VITE_*% sont remplacés au build, comme les balises og: plus haut. Le fil d'Ariane
         (BreadcrumbList) est, lui, posé page par page dans le HTML prérendu (backend/catalog/prerendu.py). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%VITE_SITE_URL%/#organisation",
            "name": "%VITE_SITE_NAME%",
            "url": "%VITE_SITE_URL%/",
            "logo": "%VITE_SITE_URL%/pwa-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#site",
            "name": "%VITE_SITE_NAME%",
            "url": "%VITE_SITE_URL%/",
            "inLanguage": ["fr", "en"],
            "publisher": { "@id": "%VITE_SITE_URL%/#organisation" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Coquille de l'accueil visiteur (audit de l'accueil du 2026-11-15, R9) : le titre et la promesse du hero sont
           dans le HTML, donc à l'écran dès que la feuille de style est là, sans attendre ~300 Ko de JavaScript. React la
           remplace à son montage par le même hero, au même endroit (voir components/CoquilleAccueil, qui reprend ces
           classes : les deux se changent ensemble, un test compare les textes). Cachée par défaut : ce HTML est celui de
           toutes les pages, le script juste dessous ne la montre que sur l'accueil d'un pays. -->
      <div id="coquille-accueil" hidden>
        <div class="h-[72px] border-b border-border md:h-[76px]"></div>
        <div class="relative mx-auto grid max-w-5xl gap-x-10 gap-y-6 px-4 pb-10 pt-10 sm:px-6 sm:pb-14 sm:pt-14 md:grid-cols-[1.1fr_1fr] md:items-center">
          <div class="md:col-start-1 md:row-start-1 md:self-end">
            <p class="mb-2 font-display text-sm italic text-primary" data-coquille="examens">BEPC · Probatoire · BAC</p>
            <h1 class="max-w-xl font-display text-4xl font-semibold leading-[1.1] tracking-tight sm:text-5xl lg:text-[3.5rem] lg:leading-[1.08]">
              <span data-coquille="titre">Chaque jour, on te dit</span>
              <span class="text-primary" data-coquille="accent">quoi réviser</span>.
            </h1>
            <p class="mt-4 max-w-lg text-muted-foreground" data-coquille="texte">25 minutes par jour sur un thème qui tombe vraiment à ton examen : un cours, un vrai exercice, un quiz.</p>
          </div>
          <div class="md:col-start-2 md:row-span-2 md:row-start-1">
            <!-- Le cadre de téléphone de la carte, à partir de lg : les classes de components/CadreTelephone, recopiées. -->
            <div class="relative lg:rounded-[2rem] lg:bg-accent lg:px-10 lg:pb-24 lg:pt-8">
              <div class="lg:mx-auto lg:max-w-[22.5rem] lg:rounded-[2.5rem] lg:border-[9px] lg:border-[hsl(150_15%_10%)] lg:bg-background lg:p-2.5 lg:shadow-2xl lg:shadow-primary/20 dark:lg:border-[hsl(155_12%_30%)]">
                <div class="hidden h-9 items-center justify-between px-2 pb-2 lg:flex"></div>
                <div class="lg:grid lg:min-h-[27.25rem]">
                  <div class="min-h-[19.5rem] rounded-2xl border border-primary/25 bg-card shadow-lg shadow-primary/5"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="min-h-[4.5rem] md:col-start-1 md:row-start-2 md:self-start"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          var p = location.pathname;
          var en = p === "/en" || p.indexOf("/en/") === 0;
          // L'accueil d'un pays : « / », « /cm », « /en », « /en/cm ». Toute autre page garde un #root vide.
          if (!/^\/?([a-z]{2}\/?)?$/i.test(en ? p.slice(3) : p)) return;
          // Un élève abonné a son propre accueil (AccueilEleve) : on ne lui montre pas la vitrine un instant.
          if (localStorage.getItem("edukora:accueil-eleve")) return;
          var c = document.getElementById("coquille-accueil");
          if (en) {
            var textes = {
              examens: "GCE O Level · GCE A Level",
              titre: "Every day, we tell you",
              accent: "what to revise",
              texte: "25 minutes a day on a topic that really comes up in your exam: a lesson, a real exam question, a quiz.",
            };
            for (var cle in textes) c.querySelector('[data-coquille="' + cle + '"]').textContent = textes[cle];
          }
          c.hidden = false;
        } catch (e) {}
      })();
    </script>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif; text-align: center">
        %VITE_SITE_NAME% a besoin de JavaScript pour fonctionner. Active-le dans ton navigateur, ou ouvre
        ce lien dans Chrome ou Safari, puis recharge la page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
