{% extends "admin/base_site.html" %}

{% block content %}
<p>Tu vas supprimer définitivement <strong>{{ total }}</strong> événement{{ total|pluralize }} d'analytics (tous, pas seulement ceux qui sont cochés ou filtrés). Cette action ne peut pas être annulée.</p>
<form method="post">
  {% csrf_token %}
  <input type="hidden" name="action" value="vider_tout">
  <input type="hidden" name="vidage_confirme" value="1">
  <input type="hidden" name="_selected_action" value="{{ premier_id }}">
  <input type="submit" value="Oui, tout vider" class="default">
  <a href="{% url 'admin:analytics_analyticsevent_changelist' %}" class="button cancel-link">Non, revenir</a>
</form>
{% endblock %}
