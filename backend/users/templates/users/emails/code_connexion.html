<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site_name }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f6f6f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f6f7; padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">

          <!-- Wordmark -->
          <tr>
            <td style="padding-bottom:24px;">
              <span style="color:#0a6745; font-size:16px; font-weight:700; letter-spacing:0.01em;">{{ site_name }}</span>
            </td>
          </tr>

          <!-- Carte -->
          <tr>
            <td style="background-color:#ffffff; border:1px solid #e5e7eb; border-radius:8px; padding:32px;">

              <p style="margin:0 0 4px 0; color:#111827; font-size:15px; line-height:1.5;">
                Bonjour,
              </p>
              <p style="margin:0 0 24px 0; color:#111827; font-size:15px; line-height:1.5;">
                Voici ton code de connexion :
              </p>

              <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border:1px solid #e5e7eb; border-radius:6px; background-color:#fafafa;">
                <tr>
                  <td style="padding:16px; text-align:center;">
                    <span style="color:#111827; font-size:28px; font-weight:600; letter-spacing:0.2em; font-family:'Courier New',Courier,monospace;">{{ code }}</span>
                  </td>
                </tr>
              </table>

              <p style="margin:20px 0 0 0; color:#6b7280; font-size:13px; line-height:1.6;">
                Valable {{ validity_minutes }} minutes. Si tu n'es pas à l'origine de cette demande, ignore ce message.
              </p>

            </td>
          </tr>

          <!-- Pied -->
          <tr>
            <td style="padding:20px 4px 0 4px;">
              <p style="margin:0; color:#9ca3af; font-size:12px; line-height:1.5;">
                {{ site_name }}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
